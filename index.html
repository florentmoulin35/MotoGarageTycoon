<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moto Garage Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D shop, HUD chips on top, round action buttons at the bottom, panels slide up as a bottom sheet */
:root{
  --sky:#8fd3ff; --ink:#2d3047; --paper:#ffffff; --soft:#eef3f8; --muted:#7b8199;
  --red:#ff5d73; --blue:#3fa9f5; --yellow:#ffc531; --green:#2ec4a0; --purple:#8c6bff; --orange:#ff7a2f;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--sky);color:var(--ink);overflow:hidden}
body{font-family:var(--font);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:manipulation}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
svg.i{width:1em;height:1em;flex:none}

/* HUD */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:99px;padding:6px 14px 6px 8px;font-weight:700;font-size:clamp(14px,2vw,20px);box-shadow:0 4px 0 #00000022;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg.i{font-size:1.4em}
.chip.small{padding:6px 10px}
.chip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.ctrl{pointer-events:auto;width:clamp(38px,5vw,48px);height:clamp(38px,5vw,48px);border-radius:50%;background:var(--paper);box-shadow:0 4px 0 #00000022;display:grid;place-items:center;font-weight:700;font-size:clamp(13px,1.8vw,17px)}
.ctrl svg.i{font-size:1.3em}
.ctrl.on{background:var(--ink);color:#fff}

.bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;gap:clamp(8px,1.6vw,16px)}
.act{position:relative;width:clamp(54px,8vw,76px);height:clamp(54px,8vw,76px);border-radius:50%;color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #00000030;transition:transform .12s}
.act svg.i{font-size:clamp(26px,3.8vw,36px)}
.act:hover{transform:translateY(-3px)}
.act:active{transform:translateY(2px);box-shadow:0 3px 0 #00000030}
.act .dot{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

/* floating popups */
.pop{position:absolute;pointer-events:none;font-weight:700;font-size:clamp(18px,2.4vw,26px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%);animation:rise 1.3s ease-out forwards;white-space:nowrap}
.pop.minus{color:var(--red)}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-50%) rotate(-3deg)}75%{transform:translateX(-50%) rotate(3deg)}}

/* bottom sheet */
#panel{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translate(-50%,0);width:min(940px,calc(100% - 24px));background:var(--paper);border-radius:26px;box-shadow:0 10px 0 #00000022,0 20px 60px #0003;padding:14px 16px 16px;transition:transform .2s,opacity .2s}
#panel[hidden]{display:none!important}
#panel header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#panel header .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
#panel header .ico svg{font-size:24px}
#panel header h2{margin:0;font-size:22px;font-weight:700;flex:1}
#panel .x{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px}
.cards{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.card{scroll-snap-align:start;flex:0 0 auto;width:178px;border-radius:20px;background:var(--soft);padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.card .art{height:92px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden}
.card .art svg{width:88%;height:auto}
.card .art .big{font-size:52px}
.card .name{font-weight:700;font-size:16px;line-height:1.1;min-height:1.1em}
.card .brand{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .stats{display:flex;gap:6px;flex-wrap:wrap}
.card .stat{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:3px 9px 3px 5px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.card .stat svg{font-size:18px}
.card .buy{border-radius:14px;padding:9px;font-weight:700;font-size:16px;background:var(--green);color:#fff;box-shadow:0 4px 0 #00000022;display:flex;justify-content:center;align-items:center;gap:6px}
.card .buy:disabled{background:#c7ccd8;box-shadow:none;cursor:not-allowed}
.card.locked .art{filter:grayscale(1);opacity:.55}
.card .lock{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.card .owned{background:var(--ink)}

/* overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#2d304788;backdrop-filter:blur(4px);padding:16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.overlay[hidden]{display:none!important}
.sheet{background:var(--paper);border-radius:30px;padding:24px;max-width:980px;width:100%;box-shadow:0 12px 0 #00000022;text-align:center}
.sheet h1{margin:0 0 4px;font-size:clamp(30px,5vw,48px);line-height:1;font-weight:700}
.sheet h1 span{color:var(--orange)}
.sheet .sub{color:var(--muted);font-size:17px;margin:0 0 18px}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bcard{border-radius:22px;padding:14px 10px 12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 #00000030;transition:transform .12s}
.bcard:hover{transform:translateY(-4px)}
.bcard .logo{font-size:26px;font-weight:700;letter-spacing:.06em}
.bcard svg.bk{width:100%;height:auto;max-width:150px}
.bcard .meters{width:100%;display:flex;flex-direction:column;gap:4px;padding:0 6px}
.meter{display:flex;align-items:center;gap:6px}
.meter svg{font-size:16px}
.meter .track{flex:1;height:8px;border-radius:4px;background:#ffffff44;overflow:hidden}
.meter .fill{height:100%;background:#fff;border-radius:4px}
.legend{display:flex;justify-content:center;gap:16px;margin-top:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.legend span{display:flex;gap:4px;align-items:center}
.cont{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.big-btn{border-radius:18px;padding:12px 22px;font-size:20px;font-weight:700;background:var(--green);color:#fff;box-shadow:0 5px 0 #00000030;display:flex;align-items:center;gap:8px}
.big-btn.ghost{background:var(--soft);color:var(--ink)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.sum{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.sum svg{font-size:32px}
.sum.neg{color:#d63b3b}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:8px 18px;font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;pointer-events:none;transition:opacity .3s}
#toast svg{font-size:20px}
@media (max-width:560px){#panel{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}.card{width:150px}}
@media (prefers-reduced-motion:reduce){.pop,.chip.bump{animation:none}.act,.bcard{transition:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc531"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e09a00" stroke-width="2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z" fill="#ffc531"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffb03a"/><g stroke="#ffb03a" stroke-width="2.4" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2 2M17.4 17.4l2 2M4.6 19.4l2-2M17.4 6.6l2-2"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a8 8 0 1 0 11 11z" fill="currentColor"/></symbol>
  <symbol id="i-bike" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="16" r="3.6"/><circle cx="19" cy="16" r="3.6"/><path d="M5 16l4-6h6l4 6M15 10l-1.5-4H17M9 10l2 6h3"/></g></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M21 6.5a5 5 0 0 1-6.6 4.7L6 19.6a2 2 0 1 1-2.8-2.8l8.4-8.4A5 5 0 0 1 17.5 3l-3 3 .5 3 3 .5z" fill="currentColor"/></symbol>

  <symbol id="i-deal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l4-3 4 2 3-2 5 1 4 3"/><path d="M6 6v7l5 4c1 .8 2 .8 2.6 0l4.4-4.6V7"/><path d="M10 13l2 1.6M12.5 11l2.4 2"/></g></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z" fill="currentColor"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z" fill="#d9a066"/><path d="M3 7l9 4 9-4M12 11v10" stroke="#a8743f" stroke-width="1.6" fill="none"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.5 12h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.6"/><circle cx="17" cy="19.5" r="1.6"/></g></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" fill="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></symbol>

</svg>

<div id="game">
  <div id="view" aria-label="Ta concession moto en 3D"></div>

  <div class="top">
    <div class="row">
      <div class="chip" id="cMoney"><svg class="i"><use href="#i-coin"/></svg><span id="money">0</span></div>
      <div class="chip" id="cRep"><svg class="i"><use href="#i-star"/></svg><span id="rep">1,0</span></div>
      <div class="chip small" id="cOrders" hidden><svg class="i"><use href="#i-box"/></svg><span id="orders">0</span></div>
    </div>
    <div class="row">
      <div class="chip" id="cDay"><svg class="i"><use href="#i-sun"/></svg><span id="day">J1 · 9:00</span></div>
      <button class="ctrl" id="bSpeed" aria-label="Vitesse">×1</button>
      <button class="ctrl" id="bPause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
    </div>
  </div>

  <div id="toast" style="opacity:0"></div>

  <div id="panel" hidden>
    <header><div class="ico" id="pIco"></div><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="Fermer"><svg class="i"><use href="#i-x"/></svg></button></header>
    <div class="cards" id="pCards"></div>
  </div>

  <div class="bar">
    <button class="act" data-p="shop" style="background:var(--red)" aria-label="Commander des motos"><svg class="i"><use href="#i-bike"/></svg></button>
    <button class="act" data-p="acc" style="background:var(--yellow)" aria-label="Accessoires"><svg class="i"><use href="#i-helmet"/></svg><span class="dot" id="dHelm">0</span></button>
    <button class="act" data-p="deal" style="background:var(--green)" aria-label="Accords constructeurs"><svg class="i"><use href="#i-deal"/></svg></button>
    <button class="act" data-p="up" style="background:var(--purple)" aria-label="Améliorer le magasin"><svg class="i"><use href="#i-up"/></svg></button>
  </div>

  <div class="overlay" id="start">
    <div class="sheet">
      <h1>Moto Garage <span>Tycoon</span></h1>
      <p class="sub">Choisis ta première marque</p>
      <div class="brands" id="brandPick"></div>
      <div class="legend">
        <span><svg class="i"><use href="#i-coin"/></svg>prix</span>
        <span><svg class="i"><use href="#i-star"/></svg>prestige</span>
        <span><svg class="i"><use href="#i-person"/></svg>clients</span>
      </div>
      <div class="cont" id="contRow" hidden>
        <button class="big-btn" id="bContinue"><svg class="i"><use href="#i-play"/></svg>Continuer</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="summary" hidden>
    <div class="sheet" style="max-width:640px">
      <h1 id="sTitle">Fin du jour 1</h1>
      <div class="sumgrid" id="sGrid"></div>
      <div class="cont"><button class="big-btn" id="bNext"><svg class="i"><use href="#i-sun"/></svg><span id="sNext">Jour 2</span></button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const ico=(n,cls='i')=>`<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const fmt=n=>Math.round(n).toLocaleString('fr-FR');

/* ================= DATA ================= */
const BRANDS={
  honda:{name:'HONDA',color:'#d6141e',price:2,prestige:3,traffic:3,deal:{cost:18000,rep:2.5},models:[
    {id:'cb125r',name:'CB125R',cost:3900,sell:4650,tier:0,col:'#d6141e'},
    {id:'cb650r',name:'CB650R',cost:8100,sell:9500,tier:1.5,col:'#2d3047'},
    {id:'africa',name:'Africa Twin',cost:14200,sell:16600,tier:3,col:'#f2f2f2'}]},
  yamaha:{name:'YAMAHA',color:'#1f5fd1',price:2,prestige:3,traffic:3,deal:{cost:18000,rep:2.5},models:[
    {id:'xsr125',name:'XSR125',cost:4100,sell:4850,tier:0,col:'#3a6fd8'},
    {id:'mt07',name:'MT-07',cost:7300,sell:8600,tier:1.5,col:'#1f2a44'},
    {id:'tracer9',name:'Tracer 9 GT',cost:13900,sell:16200,tier:3,col:'#8a94a6'}]},
  suzuki:{name:'SUZUKI',color:'#e8b400',price:2,prestige:2,traffic:3,deal:{cost:15000,rep:2},models:[
    {id:'gsxs125',name:'GSX-S125',cost:3600,sell:4250,tier:0,col:'#1f5fd1'},
    {id:'sv650',name:'SV650',cost:6900,sell:8100,tier:1.5,col:'#ffc531'},
    {id:'vstrom',name:'V-Strom 800DE',cost:11800,sell:13800,tier:3,col:'#e8e8e8'}]},
  ducati:{name:'DUCATI',color:'#a3121b',price:4,prestige:5,traffic:1,deal:{cost:40000,rep:3.5},models:[
    {id:'scrambler',name:'Scrambler Icon',cost:9800,sell:11500,tier:0,col:'#ffc531'},
    {id:'monster',name:'Monster',cost:11900,sell:13900,tier:1.5,col:'#c4161c'},
    {id:'multi',name:'Multistrada V4',cost:22500,sell:26200,tier:3,col:'#c4161c'}]},
  cfmoto:{name:'CFMOTO',color:'#14a39a',price:1,prestige:1,traffic:5,deal:{cost:8000,rep:1.5},models:[
    {id:'nk300',name:'300NK',cost:3300,sell:3950,tier:0,col:'#14a39a'},
    {id:'clx700',name:'700CL-X',cost:6200,sell:7300,tier:1.5,col:'#3a3f4d'},
    {id:'mt800',name:'800MT',cost:9900,sell:11600,tier:3,col:'#f2f2f2'}]},
};
const UPG=[
  {id:'pod4',name:'Podium',icon:'podium',cost:9000,col:'#ff5d73',req:null},
  {id:'pod5',name:'Podium',icon:'podium',cost:16000,col:'#ff5d73',req:'pod4'},
  {id:'lift2',name:'2e pont',icon:'lift',cost:12000,col:'#3fa9f5',req:null},
  {id:'mech',name:'Mécano',icon:'person',cost:10000,col:'#3fa9f5',req:null},
  {id:'wall',name:'Mur à casques',icon:'helmet',cost:4000,col:'#ffc531',req:null},
  {id:'ad1',name:'Pub radio',icon:'mega',cost:3000,col:'#8c6bff',req:null},
  {id:'ad2',name:'Pub journal',icon:'mega',cost:7000,col:'#8c6bff',req:'ad1'},
  {id:'ad3',name:'Pub TV',icon:'mega',cost:15000,col:'#8c6bff',req:'ad2'},
];
const RENT=400, HELM_COST=70, HELM_SELL=129, OPEN=9*60, CLOSE=19*60, MIN_PER_SEC=2;
const allModels=()=>Object.entries(BRANDS).flatMap(([b,B])=>B.models.map(m=>({...m,brand:b})));
const modelById=id=>allModels().find(m=>m.id===id);

/* ================= STATE ================= */
const KEY='moto-garage-save-v1';
let S=null;
function fresh(brand){
  const m=BRANDS[brand].models[0];
  return {v:1,brand,brands:[brand],money:12000,rep:1,day:1,min:OPEN,podiums:[m.id,m.id,null],orders:[],helmets:6,
    upg:{},lifts:[null],today:{bikes:0,repairs:0,helmets:0,income:0,lost:0},speed:1};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.v===1?s:null}catch(e){return null}}
const podCount=()=>3+(S.upg.pod4?1:0)+(S.upg.pod5?1:0);
const liftCount=()=>S.upg.lift2?2:1;
const helmCap=()=>S.upg.wall?20:10;
const adLevel=()=>(S.upg.ad1?1:0)+(S.upg.ad2?1:0)+(S.upg.ad3?1:0);

/* ================= 3D ================= */
const host=$('view');
const T=THREE, scene=new T.Scene();

function drawRing(L,p,done){const c=L.cv.getContext('2d');c.clearRect(0,0,128,128);
  bubbleBase(c);c.lineWidth=12;c.lineCap='round';c.strokeStyle='#e3e8ef';c.beginPath();c.arc(64,58,34,0,7);c.stroke();
  c.strokeStyle=done?'#2ec4a0':'#3fa9f5';c.beginPath();c.arc(64,58,34,-Math.PI/2,-Math.PI/2+p*Math.PI*2);c.stroke();
  if(done){c.strokeStyle='#2ec4a0';c.lineWidth=10;c.beginPath();c.moveTo(48,58);c.lineTo(60,70);c.lineTo(82,46);c.stroke()}
  else{c.fillStyle='#2d3047';c.save();c.translate(64,58);c.rotate(-.8);c.fillRect(-4,-14,8,28);c.beginPath();c.arc(0,-14,9,0,7);c.fill();c.restore()}
  L.tex.needsUpdate=true}

/* bubbles */
function bubbleBase(c){c.fillStyle='#fff';c.beginPath();c.arc(64,58,52,0,7);c.fill();c.beginPath();c.moveTo(52,104);c.lineTo(64,124);c.lineTo(76,104);c.fill()}
function drawIcon(c,kind){
  if(kind==='sale'){c.fillStyle='#ff5d73';c.beginPath();c.moveTo(64,84);c.bezierCurveTo(14,50,32,20,64,40);c.bezierCurveTo(96,20,114,50,64,84);c.fill()}
  else if(kind==='repair'){c.fillStyle='#2d3047';c.save();c.translate(64,58);c.rotate(-.8);c.fillRect(-5,-18,10,36);c.beginPath();c.arc(0,-18,12,0,7);c.fill();c.fillStyle='#fff';c.fillRect(-4,-30,8,10);c.restore()}
  else if(kind==='acc'){c.fillStyle='#ffc531';c.beginPath();c.arc(64,62,30,Math.PI,0);c.lineTo(94,74);c.lineTo(46,74);c.closePath();c.fill();c.fillStyle='#2d3047';c.fillRect(64,52,30,12)}
  else if(kind==='look'){c.fillStyle='#c7ccd8';[40,64,88].forEach(x=>{c.beginPath();c.arc(x,58,8,0,7);c.fill()})}
  else if(kind==='plus'){c.fillStyle='#2ec4a0';c.fillRect(56,30,16,56);c.fillRect(36,50,56,16)}
}
function iconTex(kind){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');bubbleBase(c);drawIcon(c,kind);return new T.CanvasTexture(cv)}

/* ================= CUSTOMERS ================= */
let customers=[];
function spawn(){
  const freePods=S.podiums.map((id,i)=>id&&i<podCount()&&!customers.some(c=>c.pod===i)?i:-1).filter(i=>i>=0);
  let r=Math.random(),type;
  if(r<.55&&freePods.length)type='sale';else if(r<.85)type='repair';else type='acc';
  const g=person(SHIRTS[Math.random()*SHIRTS.length|0],HAIRS[Math.random()*HAIRS.length|0]);
  const side=Math.random()<.5?-1:1;g.position.set(side*14,0,7.2);
  const cv=document.createElement('canvas');cv.width=cv.height=128;const tex=new T.CanvasTexture(cv);
  const sp=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false}));sp.scale.set(1,1,1);sp.position.y=2.5;sp.visible=false;g.add(sp);
  const c={g,sp,cv,tex,type,state:'walk',path:[],wait:0,patience:type==='sale'?150:type==='repair'?110:80,bob:Math.random()*6,lastDraw:-1};
  if(type==='sale'){c.pod=freePods[Math.random()*freePods.length|0];const[px,pz]=POD[c.pod];c.path=[[px,4.6],[px+.2,pz+1.5]]}
  else if(type==='repair'){const x=4.6+Math.random()*1.2;c.path=[[x,4.6],[x,3]];c.bikeCol=['#ff7a2f','#2ec4a0','#1f5fd1','#a66bff','#ffc531'][Math.random()*5|0];c.bike=bike(c.bikeCol,1.1);c.bike.position.set(-1,0,0);c.bike.rotation.y=Math.PI/2;g.add(c.bike)}
  else{c.path=[[1.6,4.6],[1.2,-1.3]]}
  c.path.unshift([c.path[0][0],7.2]);
  customers.push(c);
}
function drawBubble(c){const k=c.state==='look'?'look':c.type;const p=Math.max(0,c.wait/c.patience);const key=k+Math.round(p*20);
  if(key===c.lastDraw)return;c.lastDraw=key;const x=c.cv.getContext('2d');x.clearRect(0,0,128,128);bubbleBase(x);drawIcon(x,k);
  if(c.state==='ask'){x.lineWidth=7;x.strokeStyle=p>.7?'#ff5d73':'#2ec4a0';x.beginPath();x.arc(64,58,49,-Math.PI/2,-Math.PI/2+(1-p)*Math.PI*2);x.stroke()}
  c.tex.needsUpdate=true}
function leave(c,happy){c.state='leave';c.sp.visible=false;const side=c.g.position.x<1?-1:1;
  c.path=[[c.g.position.x,4.6],[c.g.position.x,7.2],[side*16,7.2]];if(!happy){popAt(c.g.position,'sad');S.rep=Math.max(0,S.rep-.06);S.today.lost++;updHud()}}
function stepCustomers(dt){
  for(const c of customers){
    if(c.state==='walk'||c.state==='leave'){
      const tgt=c.path[0];if(!tgt){if(c.state==='leave'){c.dead=true;continue}arrive(c);continue}
      const dx=tgt[0]-c.g.position.x,dz=tgt[1]-c.g.position.z,d=Math.hypot(dx,dz);const sp=1.1*dt;
      if(d<=sp){c.g.position.x=tgt[0];c.g.position.z=tgt[1];c.path.shift()}
      else{c.g.position.x+=dx/d*sp;c.g.position.z+=dz/d*sp;c.g.rotation.y=Math.atan2(dx,dz)}
      c.g.position.y=reduce?0:Math.abs(Math.sin(performance.now()/110+c.bob))*.06;
      if(c.bike)c.bike.userData.wheels.forEach(w=>w.rotation.z-=sp*2);
    }else{
      c.wait+=dt;c.g.position.y=0;
      if(c.state==='look'&&c.wait>20){c.state='ask';c.wait=0}
      if(c.state==='ask'&&c.wait>c.patience)leave(c,false);
      if(c.type==='sale'&&!S.podiums[c.pod])leave(c,true);
    }
    if(c.state==='look'||c.state==='ask'){c.sp.visible=true;drawBubble(c);if(!reduce)c.sp.position.y=2.5+Math.sin(performance.now()/300+c.bob)*.06}
  }
  customers=customers.filter(c=>{if(c.dead){scene.remove(c.g);return false}return true});
}
function arrive(c){
  if(c.type==='sale'){c.state='look';c.wait=0;const[px,pz]=POD[c.pod];c.g.rotation.y=Math.atan2(px-c.g.position.x,pz-c.g.position.z)}
  else{c.state='ask';c.wait=0;c.g.rotation.y=c.type==='repair'?-Math.PI/2:Math.PI}
}
function clickCustomer(c){
  if(c.state!=='ask')return;
  if(c.type==='sale'){const m=modelById(S.podiums[c.pod]);earn(m.sell,c.g.position);S.podiums[c.pod]=null;S.today.bikes++;S.rep=Math.min(5,S.rep+.05);
    if(S.helmets>0&&Math.random()<.45){S.helmets--;S.today.helmets++;setTimeout(()=>earn(HELM_SELL,c.g.position,true),350);buildHelmets()}
    buildPods();
    c.bike=bike(m.col,1.1);c.bike.position.set(0,0,-.2);c.g.add(c.bike);
    leave(c,true)}
  else if(c.type==='repair'){const i=[...Array(liftCount()).keys()].find(i=>!S.lifts[i]);
    if(i===undefined){toast('lift','Tous les ponts sont occupés');shakeAt(c.g.position);return}
    const price=120+Math.round(Math.random()*26)*10;
    S.lifts[i]={col:c.bikeCol||'#ff7a2f',price,dur:130,done:0};
    if(c.bike){c.g.remove(c.bike);c.bike=null}buildLifts();leave(c,true)}
  else if(c.type==='acc'){if(S.helmets<=0){toast('helmet','Plus de casques en stock');shakeAt(c.g.position);return}
    S.helmets--;S.today.helmets++;earn(HELM_SELL,c.g.position);S.rep=Math.min(5,S.rep+.01);buildHelmets();leave(c,true)}
  save();
}
function stepLifts(dt){
  const speed=S.upg.mech?2:1;
  lifts.forEach((L,i)=>{const job=S.lifts[i];if(!job||i>=liftCount())return;
    if(job.done<job.dur){job.done=Math.min(job.dur,job.done+dt*speed)}
    const p=job.done/job.dur;const k=Math.round(p*40);if(k!==L.lastP){L.lastP=k;drawRing(L,p,p>=1)}
    if(!reduce)L.ring.position.y=3.3+(p>=1?Math.sin(performance.now()/200)*.1:0);
    if(!reduce&&L.bike&&p<1)L.bike.userData.wheels.forEach(w=>w.rotation.z-=dt*.3)});
}
function clickLift(i){const job=S.lifts[i];if(!job||job.done<job.dur)return;
  earn(job.price,new T.Vector3(LIFT[i][0],2.4,LIFT[i][1]));S.today.repairs++;S.rep=Math.min(5,S.rep+.05);S.lifts[i]=null;buildLifts();save()}

/* ================= ECONOMY / UI ================= */
function earn(v,pos,quiet){S.money+=v;S.today.income+=v;popAt(pos,'+'+fmt(v));bumpChip('cMoney');updHud()}
function spend(v){if(S.money<v){toast('coin','Pas assez d\'argent');bumpChip('cMoney');return false}S.money-=v;updHud();bumpChip('cMoney');return true}
function bumpChip(id){const e=$(id);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
const tmpV=new T.Vector3();
function toScreen(pos){tmpV.copy(pos);tmpV.project(cam);const r=host.getBoundingClientRect();return[(tmpV.x+1)/2*r.width,(1-tmpV.y)/2*r.height]}
function popAt(pos,txt){const p=pos.clone?pos.clone():new T.Vector3(pos.x,pos.y,pos.z);p.y+=2.2;const[x,y]=toScreen(p);
  const d=document.createElement('div');d.className='pop';
  if(txt==='sad'){d.innerHTML=ico('sad');d.style.color='#ff5d73';d.style.fontSize='34px';d.style.webkitTextStroke='0'}else d.textContent=txt;
  d.style.left=x+'px';d.style.top=y+'px';$('game').appendChild(d);setTimeout(()=>d.remove(),1400)}
function shakeAt(pos){popAt(pos,'✕')}
let toastT;
function toast(icon,txt){const t=$('toast');t.innerHTML=ico(icon)+txt;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1800)}
function updHud(){
  $('money').textContent=fmt(S.money);
  $('rep').textContent=S.rep.toFixed(1).replace('.',',');
  const h=Math.floor(S.min/60),m=Math.floor(S.min%60/10)*10;
  $('day').textContent=`J${S.day} · ${h}:${String(m).padStart(2,'0')}`;
  $('cOrders').hidden=!S.orders.length;$('orders').textContent=S.orders.length;
  $('dHelm').textContent=S.helmets;
}
// bike svg for cards
const bikeSvg=(col)=>`<svg viewBox="-110 -125 230 135"><ellipse cx="0" cy="4" rx="105" ry="8" fill="#00000018"/><rect x="-75" y="-58" width="55" height="11" rx="5" fill="#b0b8c4"/><path d="M-60-32L-5-48" stroke="#5c6475" stroke-width="10" stroke-linecap="round"/><circle cx="-60" cy="-32" r="32" fill="#2b2b38"/><circle cx="-60" cy="-32" r="19" fill="#c9d1dc"/><circle cx="66" cy="-32" r="32" fill="#2b2b38"/><circle cx="66" cy="-32" r="19" fill="#c9d1dc"/><rect x="-28" y="-74" width="48" height="36" rx="8" fill="#8a94a6"/><path d="M66-32L44-104" stroke="#c9d1dc" stroke-width="9" stroke-linecap="round"/><path d="M-98-80L-74-90L-68-76Z" fill="${col}"/><path d="M-84-78Q-62-96-34-86L-36-74Q-60-72-84-72Z" fill="#2b2b38"/><path d="M-38-76Q-10-112 36-104L50-80Q0-70-38-76Z" fill="${col}" stroke="#2d304722" stroke-width="3"/><circle cx="56" cy="-92" r="10" fill="#ffe066"/><path d="M36-110L56-116" stroke="#2b2b38" stroke-width="7" stroke-linecap="round"/></svg>`;

/* panels */
let openP=null;
function openPanel(kind){openP=kind;const P=$('panel');P.hidden=false;const cards=$('pCards');let h='';
  const head={shop:['bike','var(--red)','Motos'],acc:['helmet','var(--yellow)','Accessoires'],deal:['deal','var(--green)','Constructeurs'],up:['up','var(--purple)','Magasin']}[kind];
  $('pIco').innerHTML=ico(head[0]);$('pIco').style.background=head[1];$('pTitle').textContent=head[2];
  if(kind==='shop'){
    S.brands.forEach(b=>BRANDS[b].models.forEach(m=>{const lock=S.rep<m.tier;
      h+=`<div class="card ${lock?'locked':''}"><div class="art" style="background:${BRANDS[b].color}22">${bikeSvg(m.col)}</div>
      ${lock?`<div class="lock">${ico('lock')}</div>`:''}
      <div><div class="brand">${BRANDS[b].name}</div><div class="name">${m.name}</div></div>
      <div class="stats"><span class="stat">${ico('cart')}${fmt(m.cost)}</span><span class="stat">${ico('coin')}+${fmt(m.sell-m.cost)}</span></div>
      ${lock?`<button class="buy" disabled>${ico('star')}${String(m.tier).replace('.',',')}</button>`:`<button class="buy" data-buy="${m.id}">${ico('box')}Commander</button>`}</div>`}));
  }else if(kind==='acc'){
    const full=S.helmets>=helmCap();
    h+=`<div class="card"><div class="art" style="background:#ffc53133;color:#ffc531"><svg class="i big"><use href="#i-helmet"/></svg></div>
      <div><div class="brand">Casques ×5</div><div class="name">${S.helmets} / ${helmCap()}</div></div>
      <div class="stats"><span class="stat">${ico('cart')}${fmt(HELM_COST*5)}</span><span class="stat">${ico('coin')}${HELM_SELL}/u</span></div>
      <button class="buy" data-helm="1" ${full?'disabled':''}>${ico('box')}Acheter</button></div>`;
  }else if(kind==='deal'){
    Object.entries(BRANDS).forEach(([b,B])=>{const own=S.brands.includes(b);const lock=!own&&S.rep<B.deal.rep;
      h+=`<div class="card ${lock?'locked':''}"><div class="art" style="background:${B.color}"><span style="color:#fff;font-weight:700;font-size:26px;letter-spacing:.06em">${B.name}</span></div>
      ${lock?`<div class="lock">${ico('lock')}</div>`:''}
      <div class="stats"><span class="stat">${ico('star')}${String(B.deal.rep).replace('.',',')}</span><span class="stat">${ico('coin')}${own?'—':fmt(B.deal.cost)}</span></div>
      ${own?`<button class="buy owned" disabled style="background:var(--ink);color:#fff">${ico('check')}Partenaire</button>`:lock?`<button class="buy" disabled>${ico('lock')}</button>`:`<button class="buy" data-deal="${b}">${ico('deal')}Signer</button>`}</div>`});
  }else if(kind==='up'){
    UPG.forEach(u=>{const own=S.upg[u.id];const lock=u.req&&!S.upg[u.req];if(lock)return;
      h+=`<div class="card"><div class="art" style="background:${u.col}33;color:${u.col}"><svg class="i big"><use href="#i-${u.icon}"/></svg></div>
      <div class="name">${u.name}</div>
      <div class="stats"><span class="stat">${ico('coin')}${own?'—':fmt(u.cost)}</span></div>
      ${own?`<button class="buy" disabled style="background:var(--ink);color:#fff">${ico('check')}</button>`:`<button class="buy" data-up="${u.id}">${ico('up')}Acheter</button>`}</div>`});
  }
  cards.innerHTML=h;
}
function closePanel(){openP=null;$('panel').hidden=true}
$('pClose').onclick=closePanel;
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{openP===b.dataset.p?closePanel():openPanel(b.dataset.p)});
$('pCards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){const m=modelById(b.dataset.buy);if(spend(m.cost)){S.orders.push(m.id);toast('box','Livraison demain matin');updHud();save()}}
  else if(b.dataset.helm){if(spend(HELM_COST*5)){S.helmets=Math.min(helmCap(),S.helmets+5);buildHelmets();updHud();save();openPanel('acc')}}
  else if(b.dataset.deal){const B=BRANDS[b.dataset.deal];if(spend(B.deal.cost)){S.brands.push(b.dataset.deal);buildSigns();toast('deal',B.name);save();openPanel('deal')}}
  else if(b.dataset.up){const u=UPG.find(x=>x.id===b.dataset.up);if(spend(u.cost)){S.upg[u.id]=true;buildPods();buildLifts();buildHelmets();save();openPanel('up')}}
});

/* picking in the 3D view */
R.domElement.addEventListener('pointerdown',e=>{if(!S||paused())return;const r=host.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  let best=null,bd=60;
  const test=(pos,fn)=>{const[x,y]=toScreen(pos);const d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;best=fn}};
  const v=new T.Vector3();
  customers.forEach(c=>{if(c.state!=='ask')return;c.sp.getWorldPosition(v);test(v.clone(),()=>clickCustomer(c));c.g.getWorldPosition(v);v.y+=1;test(v.clone(),()=>clickCustomer(c))});
  lifts.forEach((L,i)=>{if(i>=liftCount()||!S.lifts[i])return;L.ring.getWorldPosition(v);test(v.clone(),()=>clickLift(i))});
  pods.forEach((p,i)=>{if(i>=podCount()||S.podiums[i])return;p.plus.getWorldPosition(v);test(v.clone(),()=>openPanel('shop'))});
  if(best)best();
});

/* ================= TIME ================= */
let userPause=false,dayOver=false;
const paused=()=>userPause||dayOver||!$('start').hidden||document.hidden;
$('bPause').onclick=()=>{userPause=!userPause;$('bPause').innerHTML=ico(userPause?'play':'pause');$('bPause').classList.toggle('on',userPause)};
$('bSpeed').onclick=()=>{S.speed=S.speed===1?3:1;$('bSpeed').textContent='×'+S.speed;$('bSpeed').classList.toggle('on',S.speed>1);save()};
let spawnAcc=.75;
function stepTime(dt){
  S.min+=dt;
  const rate=1.3+S.rep*.55+adLevel()*.7+BRANDS[S.brand].traffic*.12;
  spawnAcc+=dt*rate/60;
  if(S.min<CLOSE-40&&spawnAcc>=1){spawnAcc-=1+Math.random()*.6;if(customers.filter(c=>c.state!=='leave').length<7)spawn()}
  if(S.min>=CLOSE)endDay();
}
function endDay(){S.min=CLOSE;dayOver=true;customers.forEach(c=>{if(c.state!=='leave')leave(c,true)});
  S.money-=RENT;const t=S.today;
  $('sTitle').textContent=`Fin du jour ${S.day}`;
  $('sGrid').innerHTML=[['bike',t.bikes],['wrench',t.repairs],['helmet',t.helmets],['coin','+'+fmt(t.income)],['rent','−'+RENT,'neg'],['sad',t.lost,t.lost?'neg':'']]
    .map(([i,v,c])=>`<div class="sum ${c||''}">${ico(i)}${v}</div>`).join('');
  $('sNext').textContent=`Jour ${S.day+1}`;
  $('summary').hidden=false;updHud();save()}
$('bNext').onclick=()=>{S.day++;S.min=OPEN;S.today={bikes:0,repairs:0,helmets:0,income:0,lost:0};
  const n=S.orders.length;let left=[];
  S.orders.forEach(id=>{const i=[...Array(podCount()).keys()].find(i=>!S.podiums[i]);if(i!==undefined)S.podiums[i]=id;else left.push(id)});
  S.orders=left;buildPods();if(n)toast('box',`${n-left.length} livrée${n-left.length>1?'s':''}`);
  $('summary').hidden=true;dayOver=false;updHud();save()};

/* lighting by hour */
const cDay=new T.Color('#8fd3ff'),cEve=new T.Color('#ffb98a');
function light(){const f=Math.max(0,(S.min-15*60)/(CLOSE-15*60));scene.background.copy(cDay).lerp(cEve,f);scene.fog.color.copy(scene.background);
  sun.color.setRGB(1,.96-f*.2,.84-f*.35);$('cDay').querySelector('use').setAttribute('href',f>.8?'#i-moon':'#i-sun')}

/* ================= LOOP ================= */
function size(){const w=host.clientWidth,h=host.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;
  cam.fov=w/h<1?46:w/h<1.4?38:30;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(host);size();
let last=performance.now(),saveAcc=0;
function loop(now){const dtR=Math.min(.1,(now-last)/1000);last=now;
  const tt=now/1000,a=reduce?0:Math.sin(tt*.12)*.12;const dist=cam.aspect<1?30:24;
  cam.position.set(.3+Math.sin(a)*dist,13*(dist/24),Math.cos(a)*dist);cam.lookAt(.3,.8,.3);
  if(S&&!paused()){const dt=dtR*MIN_PER_SEC*S.speed;stepTime(dt);stepCustomers(dt);stepLifts(dt);light();
    if((saveAcc+=dtR)>5){saveAcc=0;save()}if(Math.floor(S.min)%10===0)updHud()}
  else if(S&&dayOver)stepCustomers(dtR*MIN_PER_SEC*3);
  if(!reduce)pods.forEach((p,i)=>{if(p.bike&&!paused())p.bike.rotation.y+=dtR*.25});
  R.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();last=performance.now()});

/* ================= START ================= */
const meter=(icon,v)=>`<div class="meter">${ico(icon)}<div class="track"><div class="fill" style="width:${v*20}%"></div></div></div>`;
$('brandPick').innerHTML=Object.entries(BRANDS).map(([b,B])=>`<button class="bcard" data-b="${b}" style="background:${B.color}"><span class="logo">${B.name}</span>${bikeSvg(B.models[0].col==='#ffffff'?'#fff':B.models[1].col).replace('<svg','<svg class="bk"')}<div class="meters">${meter('coin',B.price)}${meter('star',B.prestige)}${meter('person',B.traffic)}</div></button>`).join('');
function begin(){buildSigns();buildHelmets();buildPods();buildLifts();updHud();$('bSpeed').textContent='×'+S.speed;$('bSpeed').classList.toggle('on',S.speed>1);$('start').hidden=true;
  if(S.min>=CLOSE){S.min=CLOSE-1}}
$('brandPick').onclick=e=>{const b=e.target.closest('.bcard');if(!b)return;S=fresh(b.dataset.b);save();begin()};
const saved=load();
if(saved){$('contRow').hidden=false;$('bContinue').onclick=()=>{S=saved;begin()}}
})();
</script>
